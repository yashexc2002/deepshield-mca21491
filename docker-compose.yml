version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: deepshield_postgres
    environment:
      POSTGRES_USER: deepshield
      POSTGRES_PASSWORD: deepshield_password
      POSTGRES_DB: deepshield_audit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: deepshield_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: deepshield_fastapi
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://deepshield:deepshield_password@postgres:5432/deepshield_audit
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  celery_worker:
    build: ./backend
    container_name: deepshield_celery
    command: celery -A celery_worker.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://deepshield:deepshield_password@postgres:5432/deepshield_audit
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres

  frontend:
    build: ./frontend
    container_name: deepshield_nextjs
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      DATABASE_URL: postgresql://deepshield:deepshield_password@postgres:5432/deepshield_audit
    depends_on:
      - backend

volumes:
  pgdata:
